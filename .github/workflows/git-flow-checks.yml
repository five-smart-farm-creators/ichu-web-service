name: Git Flow checks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch name and target
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$HEAD_REF" in
            feature/*|bugfix/*)
              echo "$HEAD_REF" | grep -Eq '^(feature|bugfix)/[a-z0-9]+(-[a-z0-9]+)*$' \
                || { echo "Use lowercase kebab-case: $HEAD_REF"; exit 1; }
              [ "$BASE_REF" = "develop" ] \
                || { echo "$HEAD_REF must target develop, not $BASE_REF"; exit 1; } ;;
            release/*|hotfix/*)
              echo "$HEAD_REF" | grep -Eq '^(release|hotfix)/v[0-9]+\.[0-9]+\.[0-9]+$' \
                || { echo "Use release/vX.Y.Z or hotfix/vX.Y.Z: $HEAD_REF"; exit 1; } ;;
            *)
              echo "Branch $HEAD_REF is not a Git Flow branch (feature/, bugfix/, release/, hotfix/)"
              exit 1 ;;
          esac

      - name: Validate commit messages
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Release branches only add their own commits; develop history was validated by earlier pull requests.
          case "$HEAD_REF" in
            release/*) range="origin/develop..$HEAD_SHA" ;;
            *) range="$BASE_SHA..$HEAD_SHA" ;;
          esac
          # The convention is enforced for commits created since its adoption; older history is kept as is.
          adoption_date="2026-11-07"
          status=0
          for sha in $(git rev-list --no-merges "$range"); do
            commit_date=$(git log -1 --format=%cs "$sha")
            if [[ "$commit_date" < "$adoption_date" ]]; then
              continue
            fi
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/commit-message"
            sh .githooks/commit-msg "$RUNNER_TEMP/commit-message" || status=1
          done
          exit $status

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        # The password exists only inside this throwaway service container; the env context is not available here.
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ICHU_TEST_CONNECTION: Host=localhost;Port=5432;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run unit and integration tests
        run: dotnet test --configuration Release

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the container image
        run: docker build --tag ichu-web-service:ci .
